<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>HDM Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-title">
      <img src="icons/icon32.png" alt="HDM" class="logo">
      <div>
        <div class="title">HDM Manager</div>
        <div class="subtitle">Trình bắt link siêu tốc</div>
      </div>
    </div>
    <div id="status-badge" class="badge disconnected">Mất kết nối</div>
  </div>

  <!-- Sniffed Media Section -->
  <div class="card media-card" id="media-card" style="display: none;">
    <div class="media-header">
      <div class="media-header-left">
        <span class="media-icon">🎬</span>
        <span class="media-title">Video phát hiện trên trang</span>
      </div>
      <span class="media-count" id="media-count">0</span>
    </div>
    <div class="media-list" id="media-list">
      <!-- Populated dynamically -->
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span class="label">Tự động bắt link tải:</span>
      <label class="switch">
        <input type="checkbox" id="chk-intercept" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08);">
      <span class="label">Hiện nút tải trên video:</span>
      <label class="switch">
        <input type="checkbox" id="chk-video-panel" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card info-card" id="info-box">
    <div class="info-row">
      <span>Đang tải:</span>
      <strong id="active-tasks">0 tác vụ</strong>
    </div>
    <div class="info-row">
      <span>Tốc độ:</span>
      <strong id="total-speed">0 KB/s</strong>
    </div>
    <div class="info-row port-row">
      <span>Cổng kết nối:</span>
      <div class="port-edit-box">
        <input type="number" id="input-port" class="port-input" min="1024" max="65535" value="9618" placeholder="9618" />
        <button id="btn-save-port" class="btn-port-save" title="Lưu số cổng kết nối">Lưu</button>
      </div>
    </div>
  </div>

  <button id="btn-open-hdm" class="btn-primary">Mở ứng dụng HDM</button>

  <script src="popup.js"></script>
</body>
</html>
